name: Build APK

# Every push builds an optimized APK and attaches it to the run (Actions → run → Artifacts).
# A push to main also publishes it as a GitHub Release, which the in-app updater picks up.
on:
  push:
    # Description-only changes don't need a new build (or a new release)
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      YML_BUILD_NUMBER: ${{ github.run_number }}
      YANDEX_SALT: "XGRlBW9FXlekgbPrRHuSiA"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Restore personal signing key (if configured)
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No KEYSTORE_BASE64 secret: the APK is signed with a one-off debug key and cannot update a previous build in place."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build optimized APK
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          # Only two secrets: the key alias is "yml" and the key password equals the store password (PKCS12)
          KEY_ALIAS: yml
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/YML-2.0.${{ github.run_number }}.apk

      - name: Remove signing key
        if: always()
        run: rm -f release.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: YML-2.0.${{ github.run_number }}
          path: out/*.apk

      - name: Publish release (main only)
        if: github.ref == 'refs/heads/main' && steps.key.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: YML Авто 2.0.${{ github.run_number }}
          files: out/*.apk
          body: ${{ github.event.head_commit.message }}

  checks:
    # Logic tests + car-screen renders in a head unit's split window (Actions → run → Artifacts → car-screens)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: All unit tests (renders the screenshots too)
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon --continue -Proborazzi.test.record=true
      - name: Publish car screens to the ci-screens branch (for review)
        if: always()
        # Review aid only: a GitHub hiccup here must not fail the checks
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/screens
          cp app/build/outputs/split-screens/*.png /tmp/screens/ 2>/dev/null || true
          # The rest of the app (ScreenshotTest renders into the reference folder)
          for f in app/src/test/screenshots/*.png; do [ -f "$f" ] && cp "$f" "/tmp/screens/app_$(basename "$f")"; done
          ls /tmp/screens/*.png >/dev/null 2>&1 || exit 0
          cd /tmp/screens
          git init -q -b ci-screens
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -qm "Car screens for ${GITHUB_SHA::7}"
          for attempt in 1 2 3 4; do
            git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screens && exit 0
            sleep $((attempt * 5))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: car-screens
          path: app/build/outputs/split-screens/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/tests/
